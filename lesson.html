<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>每日开口 · 口型跟读</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#d8e4ee;font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
#app{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:100%}
#left{overflow:auto;padding:12px 14px;border-right:1px solid #1d3a52}
#wrap{overflow:hidden;position:relative;height:100%}iframe{width:100%;height:100%;border:0;transform-origin:var(--ox,55%) var(--oy,60%)}
button{background:#071420;color:#d8e4ee;border:1px solid #1d3a52;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}select,input{background:#071420;color:#d8e4ee;border:1px solid #1d3a52;border-radius:6px;padding:5px 8px;font:inherit}
h3{margin:16px 0 6px;font-size:13px;color:#6fb4e8;letter-spacing:.08em}
.ln{padding:8px 10px;margin:4px 0;border:1px solid #12293c;border-radius:8px;cursor:pointer}
.ln:hover{border-color:#3d86bf}.ln.on{border-color:#f5a623;background:#1a1405}
.zh{color:#7f93a4;font-size:13px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#lay{display:none}@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:50% 50%}#left{border-right:0;border-top:1px solid #1d3a52}body.viewtop #wrap{order:-1}body.viewtop #app{grid-template-rows:56% 44%}#f{width:133.34%;height:133.34%;transform:scale(.75);transform-origin:0 0}body:not(.viewtop) #left{border-top:0;border-bottom:1px solid #1d3a52}#lay{display:block;position:fixed;right:10px;bottom:10px;z-index:20;background:#0b2236;color:#d8e4ee;border:1px solid #3d86bf;border-radius:20px;padding:8px 14px;font:inherit;opacity:.95}}
</style>
<button id=lay type=button></button><div id=app><div id=left><div class=bar><select id=lg><option value=en>英语</option><option value=de>德语</option><option value=ko>韩语</option><option value=vi>越南语</option><option value=ja>日语</option></select><select id=ls></select><label>语速 <span id=rv>1.0×</span><input id=rate type=range min=.5 max=1.8 step=.05 value=1 style="width:90px"></label><label><input id=zh type=checkbox checked> 中文</label><button id=imp type=button>导入</button><button id=del type=button style="display:none">删除导入</button><input id=file type=file multiple accept=".html,.htm,.json,.txt,.md,.csv" style="display:none"><div class=bar style="margin-top:8px"><label>韩语 <select id=km><option value=ipa>音标近似</option><option value=raw>韩文原文</option></select></label><label title="画面比声音早时，加大这个值让画面晚一点">画面延迟 <span id=vdv>0</span>ms <input id=vd type=range min=0 max=500 step=10 value=0 style="width:80px"></label><label>配色 <select id=th><option value="">原色</option><option value="sepia(.6) hue-rotate(-30deg) saturate(1.5) brightness(1.1)">暖色</option><option value="grayscale(1) brightness(1.15) contrast(1.1)">灰白</option><option value="hue-rotate(110deg) saturate(1.2)">绿色</option></select></label></div></div><div id=list></div></div>
<div id=wrap><iframe id=f src="index.html" allow="autoplay"></iframe></div></div>
<script src=ko_ipa.js></script>
<script>
let L=[],cur=0;const $=id=>document.getElementById(id),f=$('f');
function fx(){f.style.filter=$('th').value;try{localStorage.fx=JSON.stringify([$('th').selectedIndex])}catch(e){}}
function nocaps(){try{const d=f.contentDocument;if(d&&!d.getElementById('nc')){const st=d.createElement('style');st.id='nc';st.textContent='*{text-transform:none!important}@media(max-width:700px){.brand,.topbar-right{display:none!important}}';d.head.appendChild(st);const P=f.contentWindow.CanvasRenderingContext2D.prototype,o=P.fillText;P.fillText=function(t,...r){if(typeof t==='string'&&/^[A-Z][A-Z' .:,\-]{1,}$/.test(t))t=t.toLowerCase();return o.call(this,t,...r)}}}catch(e){}}
f.addEventListener('load',nocaps);f.addEventListener('load',()=>setTimeout(()=>{try{const nv=[...f.contentDocument.querySelectorAll('[role=radio]')].find(b=>b.textContent.trim()==='Speak');if(nv&&!nv.className.split(' ').includes('on'))nv.click()}catch(e){}},1500));$('th').oninput=fx;try{$('th').selectedIndex=JSON.parse(localStorage.fx)[0]}catch(e){}fx();


const PK='lessonPrefs';let PR={};try{PR=JSON.parse(localStorage[PK]||'{}')}catch(e){}
function savePrefs(){try{localStorage[PK]=JSON.stringify(PR)}catch(e){}}
['rate','km','zh'].forEach(i=>{const el=$(i);if(PR[i]!==undefined){if(el.type==='checkbox')el.checked=PR[i];else el.value=PR[i]}const h=()=>{PR[i]=el.type==='checkbox'?el.checked:el.value;savePrefs()};el.addEventListener('input',h);el.addEventListener('change',h)});
$('rv').textContent=(+$('rate').value).toFixed(2)+'×';document.body.classList.toggle('nozh',!$('zh').checked);

function installSync(){try{const P=f.contentWindow.MessagePort.prototype;if(P.__sync)return;const desc=Object.getOwnPropertyDescriptor(P,'onmessage');Object.defineProperty(P,'onmessage',{configurable:true,get(){return desc.get.call(this)},set(h){if(typeof h!=='function')return desc.set.call(this,h);const port=this;return desc.set.call(this,function(ev){const dl=+window.__vd||0;if(dl>0)setTimeout(()=>h.call(port,ev),dl);else h.call(port,ev)})}});P.__sync=true}catch(e){}}
f.addEventListener('load',installSync);installSync();
window.__vd=+(PR.vd||0);$('vd').value=window.__vd;$('vdv').textContent=window.__vd;
$('vd').oninput=()=>{window.__vd=+$('vd').value;$('vdv').textContent=$('vd').value;PR.vd=$('vd').value;savePrefs()};

let VT=PR.vt===undefined?true:!!PR.vt;
function applyVT(){document.body.classList.toggle('viewtop',VT);$('lay').textContent=VT?'⇅ 视图在上':'⇅ 课文在上'}
$('lay').onclick=()=>{VT=!VT;PR.vt=VT;savePrefs();applyVT()};applyVT();
let did3d=!!PR.did3d;
let BASE=[],cl=[];function fillLs(){const g=$('lg').value;cl=L.map((l,i)=>[l,i]).filter(([l])=>(l.lang||'en')===g);$('ls').innerHTML=cl.length?cl.map(([l,i])=>`<option value=${i}>${l.title}</option>`).join(''):'<option>暂无课程</option>';if(cl.length){const sv=(PR.ls||{})[g];const pick=cl.find(([l,i])=>l.title===sv)||cl[cl.length-1];$('ls').value=pick[1];show(pick[1])}else $('list').innerHTML='<p class=zh>这个语言还没有点读课。</p>'}
let IMP=[];try{IMP=JSON.parse(localStorage.importedLessons||'[]')}catch(e){}
function saveImp(){try{localStorage.importedLessons=JSON.stringify(IMP)}catch(e){alert('存储已满，无法保存导入内容')}}
fetch('lessons.json').then(r=>r.json()).then(d=>{BASE=d;L=d.concat(IMP);try{$('lg').value=localStorage.lg||'en'}catch(e){}fillLs()});

function normLines(sections){return sections.map(sec=>({title:sec.title||'导入',lines:(sec.lines||[]).map(l=>({en:l.text||l.en||'',zh:l.zh||'',roman:l.roman||'',ipa:l.ipa||''})).filter(l=>l.en)})).filter(sec=>sec.lines.length)}
function langOf(x,def){x=(x||'').toLowerCase();return x.startsWith('ja')?'ja':x.startsWith('vi')?'vi':x.startsWith('ko')?'ko':x.startsWith('de')?'de':x.startsWith('en')?'en':def}
function parseFile(name,txt,def){const base=name.replace(/\.[^.]+$/,'');const ext=(name.split('.').pop()||'').toLowerCase();
 if(ext==='html'||ext==='htm'){const m=txt.match(/const DATA = (?:\/\*DATA_START\*\/)?(\{[\s\S]*?\})(?:\/\*DATA_END\*\/)?;\s*\n/);if(!m)throw Error('没找到点读卡数据');const D=JSON.parse(m[1]);return [{title:D.title||base,lang:langOf(D.lang,def),sections:normLines(D.sections)}]}
 if(ext==='json'){const D=JSON.parse(txt);const arr=Array.isArray(D)?D:[D];return arr.map(x=>({title:x.title||base,lang:langOf(x.lang,def),sections:normLines(x.sections||[{title:'导入',lines:x.lines||[]}])}))}
 const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#')).map(x=>{const p=x.split(ext==='csv'?',':/\t|\|/).map(y=>y.trim());return {en:p[0],zh:p[1]||'',roman:p[2]||''}});
 return [{title:base,lang:def,sections:[{title:'导入',lines}]}]}
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{const fs=[...e.target.files];let last=null,errs=[];for(const f of fs){try{const r=parseFile(f.name,await f.text(),$('lg').value);for(const l of r){if(!l.sections.length)throw Error('没有可读的句子');l.imported=true;IMP=IMP.filter(x=>!(x.title===l.title&&x.lang===l.lang));IMP.push(l);last=l}}catch(err){errs.push(f.name+'：'+err.message)}}
 e.target.value='';saveImp();L=BASE.concat(IMP);if(last){$('lg').value=last.lang;try{localStorage.lg=last.lang}catch(_){}PR.ls=PR.ls||{};PR.ls[last.lang]=last.title;savePrefs();fillLs()}if(errs.length)alert('导入失败：\n'+errs.join('\n'))};
$('del').onclick=()=>{const l=L[+$('ls').value];if(l&&l.imported&&confirm('删除导入的「'+l.title+'」？')){IMP=IMP.filter(x=>x!==l&&!(x.title===l.title&&x.lang===l.lang));saveImp();L=BASE.concat(IMP);fillLs()}};
$('lg').onchange=()=>{try{localStorage.lg=$('lg').value}catch(e){}fillLs()};
$('rate').oninput=()=>$('rv').textContent=(+$('rate').value).toFixed(2)+'×';$('ls').onchange=e=>{show(+e.target.value);PR.ls=PR.ls||{};PR.ls[$('lg').value]=L[+e.target.value].title;savePrefs()};$('zh').onchange=()=>document.body.classList.toggle('nozh',!$('zh').checked);
function show(i){$('del').style.display=L[i].imported?'':'none';$('list').innerHTML=L[i].sections.map(s=>`<h3>${s.title}</h3>`+s.lines.map(l=>`<div class=ln data-lang="${L[i].lang||'en'}" data-t="${l.en.replace(/"/g,'&quot;')}" data-ipa="${(l.ipa||'').replace(/"/g,'&quot;')}"><div>${l.en}</div>${l.roman?`<div class=zh>${l.roman}</div>`:''}<div class=zh>${l.zh}</div></div>`).join('')).join('')}
document.head.insertAdjacentHTML('beforeend','<style>.nozh .zh{display:none}</style>');
$('list').onclick=async e=>{const n=e.target.closest('.ln');if(!n)return;document.querySelectorAll('.ln.on').forEach(x=>x.classList.remove('on'));n.classList.add('on');await say(n.dataset.t,n.dataset.lang,n.dataset.ipa)};
function hint(m){let h=$('hint');if(!h){h=document.createElement('div');h.id='hint';h.style.cssText='position:fixed;left:14px;bottom:14px;background:#1a1405;border:1px solid #f5a623;color:#f5d48a;padding:8px 12px;border-radius:8px;z-index:9';document.body.appendChild(h)}h.textContent=m;h.style.display='block';clearTimeout(h.t);h.t=setTimeout(()=>h.style.display='none',2500)}
async function say(t,lang,ipa){const d=f.contentDocument,w=f.contentWindow;
 const curMode=(()=>{const on=[...d.querySelectorAll('[role=radio]')].find(b=>['Play','Speak','Sing','Bestiary','Beatbox'].includes(b.textContent.trim())&&(b.getAttribute('aria-checked')==='true'||b.className.split(' ').includes('on')));return on?on.textContent.trim():''})();
 const mode=curMode;
 if(mode!=='Speak'&&mode!=='Sing'){hint('请先在右侧选择 Speak 或 Sing');return}
 if(mode==='Sing'){const ta=d.querySelector('textarea'),prim=d.querySelector('button.act-primary');if(!ta||!prim)return;if(/stop/i.test(prim.textContent)){prim.click();await new Promise(r=>setTimeout(r,250))}
  Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value').set.call(ta,t);ta.dispatchEvent(new w.Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,200));prim.click();return}
 const ta=d.querySelector('textarea'),prim=d.querySelector('button.act-primary');if(!ta||!prim)return;
 if(/stop/i.test(prim.textContent)){prim.click();await new Promise(r=>setTimeout(r,250))}
 Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value').set.call(ta,t);ta.dispatchEvent(new w.Event('input',{bubbles:true}));
 const T=[[0,.5],[200,.76],[385,1],[500,1.15],[700,1.41],[850,1.6],[1000,1.8]],x=+$('rate').value;
 let v=1000;for(let i=1;i<T.length;i++)if(x<=T[i][1]){v=T[i-1][0]+(x-T[i-1][1])/(T[i][1]-T[i-1][1])*(T[i][0]-T[i-1][0]);break}
 const rr=[...d.querySelectorAll('input[type=range]')].find(el=>{let p=el.parentElement;for(let i=0;i<4&&p;i++){if(/×/.test(p.textContent))return true;p=p.parentElement}return false});
 if(rr){Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype,'value').set.call(rr,Math.round(v));rr.dispatchEvent(new w.Event('input',{bubbles:true}))}
 const chip=[...d.querySelectorAll('button.chip')].find(b=>/text is ipa/i.test(b.textContent));const wantIpa=(lang==='ko'&&$('km').value!=='raw')||((lang==='vi'||lang==='ja')&&!!ipa);
 if(chip&&chip.classList.contains('on')!==wantIpa){chip.click();await new Promise(r=>setTimeout(r,300))}
 if(wantIpa)t=(lang==='vi'||lang==='ja')?ipa:koIPA(t);
 Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value').set.call(ta,t);ta.dispatchEvent(new w.Event('input',{bubbles:true}));
 prim.click()}
</script>
