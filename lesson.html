<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>每日开口 · 口型跟读</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#d8e4ee;font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
#app{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:100%}
#left{overflow:auto;padding:12px 14px;border-right:1px solid #1d3a52}
#wrap{overflow:hidden;position:relative;height:100%}iframe{width:100%;height:100%;border:0;transform-origin:var(--ox,55%) var(--oy,60%)}
select,input{background:#071420;color:#d8e4ee;border:1px solid #1d3a52;border-radius:6px;padding:5px 8px;font:inherit}
h3{margin:16px 0 6px;font-size:13px;color:#6fb4e8;letter-spacing:.08em}
.ln{padding:8px 10px;margin:4px 0;border:1px solid #12293c;border-radius:8px;cursor:pointer}
.ln:hover{border-color:#3d86bf}.ln.on{border-color:#f5a623;background:#1a1405}
.zh{color:#7f93a4;font-size:13px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:45% 55%}}
</style>
<div id=app><div id=left><div class=bar><select id=lg><option value=en>英语</option><option value=de>德语</option><option value=ko>韩语</option></select><select id=ls></select><label>语速 <span id=rv>1.0×</span><input id=rate type=range min=.5 max=1.8 step=.05 value=1 style="width:90px"></label><label><input id=zh type=checkbox checked> 中文</label><div class=bar style="margin-top:8px"><label>配色 <select id=th><option value="">原色</option><option value="sepia(.6) hue-rotate(-30deg) saturate(1.5) brightness(1.1)">暖色</option><option value="grayscale(1) brightness(1.15) contrast(1.1)">灰白</option><option value="hue-rotate(110deg) saturate(1.2)">绿色</option></select></label></div></div><div id=list></div></div>
<div id=wrap><iframe id=f src="index.html" allow="autoplay"></iframe></div></div>
<script src=ko_ipa.js></script>
<script>
let L=[],cur=0;const $=id=>document.getElementById(id),f=$('f');
function fx(){f.style.filter=$('th').value;try{localStorage.fx=JSON.stringify([$('th').selectedIndex])}catch(e){}}
function nocaps(){try{const d=f.contentDocument;if(d&&!d.getElementById('nc')){const st=d.createElement('style');st.id='nc';st.textContent='*{text-transform:none!important}';d.head.appendChild(st);const P=f.contentWindow.CanvasRenderingContext2D.prototype,o=P.fillText;P.fillText=function(t,...r){if(typeof t==='string'&&/^[A-Z][A-Z' .:,\-]{1,}$/.test(t))t=t.toLowerCase();return o.call(this,t,...r)}}}catch(e){}}
f.addEventListener('load',nocaps);setInterval(nocaps,1500);
$('th').oninput=fx;try{$('th').selectedIndex=JSON.parse(localStorage.fx)[0]}catch(e){}fx();

let cl=[];function fillLs(){const g=$('lg').value;cl=L.map((l,i)=>[l,i]).filter(([l])=>(l.lang||'en')===g);$('ls').innerHTML=cl.length?cl.map(([l,i])=>`<option value=${i}>${l.title}</option>`).join(''):'<option>暂无课程</option>';if(cl.length){$('ls').value=cl[cl.length-1][1];show(cl[cl.length-1][1])}else $('list').innerHTML='<p class=zh>这个语言还没有点读课。</p>'}
fetch('lessons.json').then(r=>r.json()).then(d=>{L=d;try{$('lg').value=localStorage.lg||'en'}catch(e){}fillLs()});
$('lg').onchange=()=>{try{localStorage.lg=$('lg').value}catch(e){}fillLs()};
$('rate').oninput=()=>$('rv').textContent=(+$('rate').value).toFixed(2)+'×';$('ls').onchange=e=>show(+e.target.value);$('zh').onchange=()=>document.body.classList.toggle('nozh',!$('zh').checked);
function show(i){$('list').innerHTML=L[i].sections.map(s=>`<h3>${s.title}</h3>`+s.lines.map(l=>`<div class=ln data-lang="${L[i].lang||'en'}" data-t="${l.en.replace(/"/g,'&quot;')}"><div>${l.en}</div>${l.roman?`<div class=zh>${l.roman}</div>`:''}<div class=zh>${l.zh}</div></div>`).join('')).join('')}
document.head.insertAdjacentHTML('beforeend','<style>.nozh .zh{display:none}</style>');
$('list').onclick=async e=>{const n=e.target.closest('.ln');if(!n)return;document.querySelectorAll('.ln.on').forEach(x=>x.classList.remove('on'));n.classList.add('on');await say(n.dataset.t,n.dataset.lang)};
async function say(t,lang){const d=f.contentDocument,w=f.contentWindow;
 const nav=[...d.querySelectorAll('[role=radio],button')].find(b=>b.textContent.trim()==='Speak'&&(b.getAttribute('role')==='radio'||!b.className.includes('act-primary')));
 if(nav&&!nav.className.split(' ').includes('on')&&nav.getAttribute('aria-checked')!=='true'){nav.click();await new Promise(r=>setTimeout(r,700))}
 const t3=[...d.querySelectorAll('label.toggle')].find(l=>l.textContent.trim()==='3D')?.querySelector('input');
 if(t3&&!t3.checked){t3.click();await new Promise(r=>setTimeout(r,1500))}
 const ta=d.querySelector('textarea'),prim=d.querySelector('button.act-primary');if(!ta||!prim)return;
 if(/stop/i.test(prim.textContent)){prim.click();await new Promise(r=>setTimeout(r,250))}
 Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value').set.call(ta,t);ta.dispatchEvent(new w.Event('input',{bubbles:true}));
 const T=[[0,.5],[200,.76],[385,1],[500,1.15],[700,1.41],[850,1.6],[1000,1.8]],x=+$('rate').value;
 let v=1000;for(let i=1;i<T.length;i++)if(x<=T[i][1]){v=T[i-1][0]+(x-T[i-1][1])/(T[i][1]-T[i-1][1])*(T[i][0]-T[i-1][0]);break}
 const rr=[...d.querySelectorAll('input[type=range]')].find(el=>{let p=el.parentElement;for(let i=0;i<4&&p;i++){if(/×/.test(p.textContent))return true;p=p.parentElement}return false});
 if(rr){Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype,'value').set.call(rr,Math.round(v));rr.dispatchEvent(new w.Event('input',{bubbles:true}))}
 const chip=[...d.querySelectorAll('button.chip')].find(b=>/text is ipa/i.test(b.textContent));const wantIpa=lang==='ko';
 if(chip&&chip.classList.contains('on')!==wantIpa){chip.click();await new Promise(r=>setTimeout(r,300))}
 if(wantIpa)t=koIPA(t);
 Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value').set.call(ta,t);ta.dispatchEvent(new w.Event('input',{bubbles:true}));
 prim.click()}
</script>
